<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="The Utopian Autonomy team's CRM: every customer, investor, advisor and connector in one place."
    />
    <title>UA · Internal CRM</title>
    <!-- The link preview (D-058): what WhatsApp, Slack and email show for a shared link. Every
         link opens the same page, so no contact's details can appear here. The image is drawn
         by scripts/og-image.ts; crawlers need its full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Utopian Autonomy" />
    <meta property="og:title" content="UA · Internal CRM" />
    <meta
      property="og:description"
      content="The Utopian Autonomy team's CRM: every customer, investor, advisor and connector in one place."
    />
    <meta property="og:url" content="https://ua-crm-zeta.vercel.app/" />
    <meta property="og:image" content="https://ua-crm-zeta.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Utopian Autonomy mark, with Internal CRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Sets the theme before first paint so there is never a flash of the wrong theme.
      // Keep the key and values in sync with src/app/theme.tsx.
      ;(() => {
        let mode = 'light'
        try {
          const stored = localStorage.getItem('ua-crm:theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
        } catch {}
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
