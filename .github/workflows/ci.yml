name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs, e.g. right after the Visual baselines workflow commits (a bot push does not
  # start CI on its own).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  quality:
    name: Lint, typecheck, unit and component tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests with coverage
        # Fails below 70% lines overall or 90% lines in src/domain (vitest.config.ts).
        run: pnpm test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const total = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8")).total
            const rows = ["lines", "statements", "branches", "functions"].map(
              (key) => `| ${key} | ${total[key].pct}% | ${total[key].covered} / ${total[key].total} |`,
            )
            console.log(["### Coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

  browser:
    name: End-to-end, accessibility, visual and performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep this tag equal to the installed @playwright/test version (package.json and
    # pnpm-lock.yaml); scripts/visual-update.ts reads the same version for local baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # The image runs as root; keep HOME consistent for git, corepack and the browsers.
      HOME: /root
    steps:
      - name: Ensure git is available
        # Without git, checkout falls back to a plain download with no .git directory.
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Browsers come with the image, so there is no `playwright install` step.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Accessibility tests
        if: ${{ !cancelled() }}
        run: pnpm test:a11y

      - name: Visual regression tests
        if: ${{ !cancelled() }}
        run: pnpm test:visual

      - name: Performance smoke tests
        if: ${{ !cancelled() }}
        run: pnpm test:perf

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  db:
    name: Database policies, Supabase contract and live browser tests on local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start local Supabase
        # Only what the app uses: the database, auth, the API gateway, PostgREST, Realtime and
        # Storage. The migrations in supabase/migrations are applied on start.
        run: pnpm exec supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Database policy tests (pgTAP)
        run: pnpm exec supabase test db

      - name: Point the tests at local Supabase
        # The local stack's own throwaway keys, never the project's.
        run: |
          pnpm exec supabase status -o env | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          {
            echo "UA_TEST_SUPABASE_URL=$API_URL"
            echo "UA_TEST_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "UA_TEST_SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"

      - name: Repository contract against Supabase
        # The same suite LocalRepository passes, with four signed-in members and every refusal.
        run: pnpm exec vitest run --project contract tests/contract/supabase.contract.test.ts

      - name: Calendar store contract against Supabase
        run: pnpm exec vitest run --project server tests/server/supabaseStore.test.ts

      - name: Install Chromium for the live browser tests
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Live browser tests (two members, view only, a forced write refused, Realtime)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:live

      - name: Upload live test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-live
          path: test-results-live/
          retention-days: 14

      - name: Stop local Supabase
        if: ${{ always() }}
        run: pnpm exec supabase stop --no-backup
